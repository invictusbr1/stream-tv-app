name: Testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Os testes automatizados usam apenas recursos nativos do Node:
      # não é preciso instalar dependências para verificá-los.
      - name: Verificação de sintaxe
        run: |
          for arquivo in server.js playback.js library.js personal.js auth.js jarvis.js acesso.js legendas.js android/app/src/main/assets/catalog.js; do
            node --check "$arquivo"
          done
      - name: Testes automatizados
        run: npm test
