plugins { id 'com.android.application' }
android {
    namespace 'br.streamtv.app'
    compileSdk 35
    defaultConfig {
        applicationId 'br.streamtv.app'
        minSdk 23
        targetSdk 35
    versionCode 376
    versionName '2.13.46'
    }
    // Dois aplicativos saem do mesmo código: o do celular e o da TV. O da TV tem
    // pacote próprio (br.streamtv.app.tv), abre sempre na interface de 10 pés
    // (controle remoto) e é mais leve para não travar em TV box.
    flavorDimensions 'tela'
    productFlavors {
        celular {
            dimension 'tela'
            applicationId 'br.streamtv.app'
            buildConfigField 'boolean', 'TV', 'false'
        }
        tv {
            dimension 'tela'
            applicationId 'br.streamtv.app.tv'
            buildConfigField 'boolean', 'TV', 'true'
        }
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}




















