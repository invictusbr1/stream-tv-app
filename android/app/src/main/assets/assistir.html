<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><title>Conecta TV — modo com anúncios</title>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#000;color:#fff;font:15px system-ui,-apple-system,'Segoe UI',sans-serif}body{height:100dvh;display:flex;flex-direction:column}.topo{display:flex;align-items:center;gap:10px;padding:10px 14px;background:linear-gradient(180deg,#000000e6,#0000);position:absolute;top:0;left:0;right:0;z-index:3}.icone{display:inline-flex;align-items:center;justify-content:center;min-width:42px;height:42px;border:0;border-radius:12px;background:#ffffff14;color:#fff;font-size:18px;line-height:1;text-decoration:none;cursor:pointer}.icone:hover{background:#ffffff26}.nome-fonte{margin-left:2px;font-size:13.5px;font-weight:600;color:#e9edf4;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.palco{position:relative;flex:1;min-height:0;background:#000}iframe{border:0;width:100%;height:100%;display:block}.aviso{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:32px;font-size:15px;color:#c9d2e0;background:#000;z-index:2}.aviso[hidden]{display:none}.trava{position:absolute;inset:0;z-index:2}:not([hidden]).trava{display:block}</style></head>
<body><div class="topo"><a class="icone" href="/index.html" aria-label="Voltar ao catálogo" title="Voltar ao catálogo">‹</a><span id="title" class="nome-fonte">Preparando…</span><button id="bloqueio-toque" class="icone" aria-label="Bloquear toque na tela" title="Bloquear o toque na tela">🔓</button><button id="tela-cheia" class="icone" aria-label="Tela cheia" title="Tela cheia">⛶</button><button id="outra-fonte" class="icone" aria-label="Outra fonte" title="Outra fonte">⟳</button><a class="icone" href="/remote-pointer" aria-label="Cursor do controle" title="Cursor do controle">◇</a></div><div class="palco"><div id="trava" class="trava" hidden></div><p id="status" class="aviso">Preparando…</p></div><script src="/catalog.js"></script><script src="/android.js"></script><script src="/personal.js"></script><script>
(async () => {
    const status = document.getElementById('status');
    const params = new URLSearchParams(location.search);
    const id = params.get('id'), index = params.get('source');
    const isTV=params.get('type')==='tv',season=params.get('season'),episode=params.get('episode');
    if(isTV&&(!/^\d{1,3}$/.test(season||'')||! /^[1-9]\d{0,3}$/.test(episode||'')||!/^[0-8]$/.test(index||''))){status.textContent='Episódio inválido.';return;}
    if (!/^\d{1,10}$/.test(id || '') || !/^(?:[0-9]|10)$/.test(index || '')) { status.textContent = 'Fonte inválida.'; return; }
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 15000);
    try {
        const config = await fetch('/config.json', { signal: controller.signal }).then(r => { if (!r.ok) throw Error(); return r.json(); });
        const catalog = createCatalog(window.fetch.bind(window), config.tmdbKey);
        // No aparelho não existe servidor: as rotas /api são respondidas pelo próprio catálogo local.
        const local = typeof androidCatalog !== 'undefined' ? await androidCatalog : null;
        const consulta = local || catalog;
        const source = (isTV?(await consulta.request(`/api/episode/${id}/${season}/${episode}`,controller.signal)).players:await consulta.sources(id, controller.signal)).find(p => p.index === Number(index));
        if (!source || !source.funcionou) throw Error();
        let item={id,titulo:(isTV?'Série ':'Filme ')+id};
        catalog.describe(id,isTV,controller.signal).then(f=>item=f).catch(()=>{});
        (document.getElementById('save-point')||{set onclick(v){}}).onclick=()=>{const match=document.getElementById('saved-point').value.trim().match(/^(\d{1,3}):([0-5]\d)$/);const note=document.getElementById('saved-note');if(!match||Number(match[1])*60+Number(match[2])<1){note.textContent='Use o formato 32:10.';return;}try{const store=createStreamPersonal(localStorage);const f={...item,episode:isTV?{season:Number(season),number:Number(episode)}:null};if(isTV)f.titulo+=' · T'+season+' E'+episode;store.save(f,Number(match[1])*60+Number(match[2]),null,true);note.textContent='Anotado. Avance manualmente até esse ponto quando voltar.';}catch{note.textContent='Não foi possível salvar neste aparelho.';}};
        document.getElementById('title').textContent = source.nome.replace(/\s*\(.*?\)/,'').trim();
        // O robô confere se esta fonte tem este episódio; se não tiver, já passa para a próxima.
        const trocarFonte = async (motivo) => {
            try{const tipo=isTV?'serie':'filme';const ruins=JSON.parse(localStorage.getItem('streamtv-fontes-ruins')||'{}');ruins[tipo]=[...new Set([...(ruins[tipo]||[]),source.nome])].slice(-6);localStorage.setItem('streamtv-fontes-ruins',JSON.stringify(ruins));const boas=JSON.parse(localStorage.getItem('streamtv-fontes-boas')||'{}');if(boas[tipo]===source.nome){boas[tipo]=null;localStorage.setItem('streamtv-fontes-boas',JSON.stringify(boas));}}catch{}
            const proximo = Number(index) + 1;
            if (proximo > 8) { status.hidden = false; status.textContent = (motivo ? motivo + '. ' : '') + 'Nenhuma outra fonte para tentar. Volte ao catálogo.'; return; }
            status.hidden = false; status.textContent = (motivo ? motivo + '. ' : '') + 'Trocando para a próxima fonte...';
            await new Promise(r => setTimeout(r, 900));
            const proximoEndereco = new URL(location.href); proximoEndereco.searchParams.set('source', String(proximo)); location.href = proximoEndereco.href;
        };
        window.StreamFonteFalhou = trocarFonte;
        document.getElementById('outra-fonte').onclick = () => {ficouBom=true;trocarFonte('');};
        setTimeout(()=>{if(ficouBom||status.hidden===false)return;status.hidden=false;status.style.background='#2a2113';status.textContent='Se o vídeo não apareceu, toque em ⟳ Outra fonte no topo.';},22000);
        if (!source.directory) {
            try {
                const verificado = await fetch(`/api/fonte?tipo=${isTV?'tv':'movie'}&id=${id}&season=${season||''}&episode=${episode||''}&fonte=${index}`, { signal: controller.signal }).then(r => (r.ok ? r.json() : null));
                if (verificado && verificado.ok === false) { await trocarFonte(verificado.motivo || 'fonte indisponível'); return; }
            } catch { /* sem verificador (aparelho sem servidor): segue normalmente */ }
        }
        // Guarda a fonte que funcionou para ela vir primeiro na próxima vez.
        let ficouBom=false;setTimeout(()=>{if(ficouBom||document.hidden)return;ficouBom=true;try{const memoria=JSON.parse(localStorage.getItem('streamtv-fontes-boas')||'{}');memoria[isTV?'serie':'filme']=source.nome;localStorage.setItem('streamtv-fontes-boas',JSON.stringify(memoria));}catch{}},15000);
        if(source.directory){
            const url=await catalog.directoryUrl(source,id,isTV,controller.signal,season,episode);
            status.textContent=isTV?`Busque o título e selecione a temporada ${season}, episódio ${episode} na fonte. Confira se há áudio dublado.`:'Escolha o título na fonte e confira se há áudio dublado.';
            const link=document.createElement('a');link.href=url;link.target='_blank';link.rel='noopener';link.textContent='Abrir busca na fonte';link.style.cssText='display:block;padding:20px;margin:16px;background:#b91c1c;color:white;font-size:20px';(document.querySelector('.palco')||document.body).append(link);link.focus();return;
        }
        const frame = document.createElement('iframe');
        frame.id = 'video'; frame.title = 'Player com anúncios';
        frame.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen'; frame.allowFullscreen = true;
        frame.src = source.url;
        status.hidden = true; (document.querySelector('.palco')||document.body).appendChild(frame);
    } catch { status.textContent = 'Não foi possível preparar esta fonte. Volte ao catálogo e tente outra.'; }
    finally { clearTimeout(timer); }
})();

// ---- tela cheia e bloqueio do toque ----
const trava=document.getElementById("trava"),botaoTrava=document.getElementById("bloqueio-toque"),botaoTela=document.getElementById("tela-cheia");
let bloqueado=false;
try{bloqueado=localStorage.getItem("streamtv-trava-toque")==="true";}catch{}
function aplicarTrava(){trava.hidden=!bloqueado;botaoTrava.textContent=bloqueado?"🔒":"🔓";botaoTrava.title=bloqueado?"Toque na tela bloqueado (não pausa)":"Toque na tela liberado";botaoTrava.setAttribute("aria-label",botaoTrava.title);try{localStorage.setItem("streamtv-trava-toque",String(bloqueado));}catch{}}
botaoTrava.onclick=()=>{bloqueado=!bloqueado;aplicarTrava();};
aplicarTrava();
// depois de 25s, bloqueia sozinho: o vídeo já está rodando e o toque só pausaria
setTimeout(()=>{if(!bloqueado){bloqueado=true;aplicarTrava();}},25000);
function alternarTela(){if(document.fullscreenElement){document.exitFullscreen&&document.exitFullscreen();}else{document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>{});}}
botaoTela.onclick=alternarTela;
// tenta abrir em tela cheia (no aparelho a tela cheia é nativa e não depende disso)
setTimeout(()=>{document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>{});},1500);


</script></body></html>
