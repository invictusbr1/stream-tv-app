services:
  - type: web
    name: stream-tv-familia
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm run start:web
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: JARVIS_PROVIDER
        value: groq
      - key: JARVIS_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
