<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloudstream TV</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0d0d0d; color: #fff; font-family: 'Segoe UI', sans-serif; }

        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 22px 36px;
            background: linear-gradient(to bottom, #000 0%, transparent 100%);
            position: sticky; top: 0; z-index: 100;
        }
        h1 { color: #E50914; font-size: 1.9rem; letter-spacing: 1px; }

        .busca { display: flex; gap: 8px; }
        .busca input {
            padding: 10px 18px; font-size: 1rem; border-radius: 6px;
            border: 2px solid #333; background: #1a1a1a; color: #fff; width: 260px;
            transition: border-color .2s;
        }
        .busca input:focus { border-color: #E50914; outline: none; }
        .busca button {
            padding: 10px 22px; background: #E50914; color: #fff;
            border: none; border-radius: 6px; font-weight: bold; cursor: pointer;
        }
        .busca button:hover { background: #b8070f; }

        .secao { padding: 8px 36px 48px; }
        .secao-label { font-size: .85rem; color: #555; margin-bottom: 16px; text-transform: uppercase; letter-spacing: 2px; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
            gap: 16px;
        }
        .card {
            background: #1a1a1a; border-radius: 8px; overflow: hidden;
            cursor: pointer; border: 3px solid transparent;
            transition: transform .2s, border-color .2s;
        }
        .card:hover, .card:focus { transform: scale(1.06); border-color: #E50914; outline: none; }
        .card img { width: 100%; height: 232px; object-fit: cover; display: block; background: #222; }
        .card-info { padding: 9px 11px; }
        .card-titulo { font-weight: bold; font-size: .83rem; line-height: 1.3; }
        .card-meta { font-size: .72rem; color: #f5c518; margin-top: 3px; }
        .msg { grid-column: 1/-1; text-align: center; padding: 60px 0; color: #444; }

        /* PLAYER */
        #player {
            display: none; position: fixed; inset: 0;
            background: #000; z-index: 9999; flex-direction: column;
        }
        #player.ativo { display: flex; }

        .barra {
            position: absolute; top: 0; left: 0; right: 0; z-index: 200;
            display: flex; align-items: center; gap: 8px; padding: 10px 14px;
            background: rgba(0,0,0,.95); flex-wrap: wrap; min-height: 52px;
        }
        .btn-voltar {
            background: #E50914; color: #fff; border: none;
            padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer;
            flex-shrink: 0;
        }
        .btn-voltar:hover { background: #b8070f; }
        #titulo-player {
            font-size: .9rem; color: #ccc; flex: 1;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }

        #fontes { display: flex; gap: 5px; flex-wrap: wrap; }
        .btn-fonte {
            border: none; padding: 6px 11px; border-radius: 5px;
            font-size: .73rem; font-weight: bold; cursor: pointer; white-space: nowrap;
        }
        .dub-on  { background: #1a7a3a; color: #fff; border: 2px solid #2ecc71; }
        .dub-off { background: #0d3d1d; color: #777; border: 2px solid #144d24; }
        .leg-on  { background: #1a3a6e; color: #fff; border: 2px solid #3b82f6; }
        .leg-off { background: #0d1f3d; color: #777; border: 2px solid #122050; }
        .falhou  { background: #222; color: #444; border: 2px solid #333; cursor: not-allowed; text-decoration: line-through; }

        .badge { font-size: .6rem; padding: 1px 4px; border-radius: 3px; font-weight: bold; margin-left: 3px; }
        .badge-dub { background: #2ecc71; color: #000; }
        .badge-leg { background: #3b82f6; color: #fff; }

        /* iframe SEM sandbox */
        #frame { width: 100%; flex: 1; border: none; margin-top: 52px; }

        #loading {
            display: none; position: absolute;
            top: 52px; left: 0; right: 0; bottom: 0;
            background: #000; z-index: 150;
            flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        }
        #loading.vis { display: flex; }
        .spinner {
            width: 50px; height: 50px;
            border: 4px solid #222; border-top-color: #E50914;
            border-radius: 50%; animation: spin .8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #load-msg { color: #888; font-size: .95rem; text-align: center; max-width: 340px; }
        #load-sub { color: #555; font-size: .8rem; }
    </style>
</head>
<body>

<div class="header">
    <h1>☁ Cloudstream TV</h1>
    <div class="busca">
        <input id="q" type="text" placeholder="Buscar filme..."
            onkeydown="if(event.key==='Enter') buscar()" tabindex="0">
        <button onclick="buscar()">Buscar</button>
    </div>
</div>

<div class="secao">
    <div class="secao-label" id="label">Em Alta</div>
    <div class="grid" id="grid"><p class="msg">Carregando...</p></div>
</div>

<div id="player">
    <div class="barra">
        <button class="btn-voltar" onclick="fechar()">⬅ VOLTAR</button>
        <span id="titulo-player"></span>
        <div id="fontes"></div>
    </div>
    <div id="loading">
        <div class="spinner"></div>
        <div id="load-msg">Procurando melhor fonte...</div>
        <div id="load-sub">Testando fontes com dublagem PT-BR</div>
    </div>
    <!-- SEM sandbox -->
    <iframe id="frame" src=""
        allowfullscreen
        allow="autoplay; encrypted-media; picture-in-picture; fullscreen">
    </iframe>
</div>

<script>
    // ─────────────────────────────────────────────────────────
    // CONFIG: troque pela URL do Railway quando hospedar
    // Local:  'http://192.168.1.32:3000/api'
    // Railway: 'https://SEU-APP.up.railway.app/api'
    // ─────────────────────────────────────────────────────────
    const API = 'http://192.168.1.32:3000/api';

    let players = [];

    // ── CATÁLOGO ─────────────────────────────────────────────
    function renderizar(lista) {
        const g = document.getElementById('grid');
        g.innerHTML = '';
        if (!lista.length) { g.innerHTML = '<p class="msg">Nenhum resultado.</p>'; return; }
        lista.forEach(f => {
            const c = document.createElement('div');
            c.className = 'card'; c.tabIndex = 0;
            c.innerHTML = `
                <img src="${f.capa || ''}" alt="${f.titulo}" loading="lazy"
                     onerror="this.style.background='#333'">
                <div class="card-info">
                    <div class="card-titulo">${f.titulo}</div>
                    <div class="card-meta">⭐ ${f.nota}${f.ano ? ' · ' + f.ano : ''}</div>
                </div>`;
            c.onclick = () => abrirPlayer(f.id, f.titulo);
            c.onkeydown = e => { if (e.key === 'Enter') abrirPlayer(f.id, f.titulo); };
            g.appendChild(c);
        });
    }

    async function emAlta() {
        document.getElementById('label').textContent = 'Em Alta';
        try {
            renderizar(await (await fetch(`${API}/em-alta`)).json());
        } catch {
            document.getElementById('grid').innerHTML =
                '<p class="msg">❌ Servidor offline. Inicie o server.js.</p>';
        }
    }

    async function buscar() {
        const q = document.getElementById('q').value.trim();
        if (!q) return emAlta();
        document.getElementById('label').textContent = `Resultados: "${q}"`;
        document.getElementById('grid').innerHTML = '<p class="msg">Buscando...</p>';
        try {
            renderizar(await (await fetch(`${API}/buscar?nome=${encodeURIComponent(q)}`)).json());
        } catch { alert('Erro ao buscar.'); }
    }

    // ── PLAYER ───────────────────────────────────────────────
    async function abrirPlayer(id, titulo) {
        document.getElementById('player').classList.add('ativo');
        document.getElementById('titulo-player').textContent = titulo || '...';
        document.getElementById('frame').src = '';
        document.getElementById('fontes').innerHTML = '';
        setLoading('Buscando IMDB ID e testando fontes...', 'Priorizando dublagem PT-BR');

        try {
            const data = await (await fetch(`${API.replace('/api','')}/api/player/${id}`)).json();
            players = data.players || [];

            const wrap = document.getElementById('fontes');
            players.forEach((p, i) => {
                const btn = document.createElement('button');
                btn.className = 'btn-fonte ' + classeBtn(p, false);
                btn.innerHTML  = p.nome + `<span class="badge ${p.dub?'badge-dub':'badge-leg'}">${p.dub?'DUB':'LEG'}</span>`;
                btn.disabled   = !p.funcionou;
                btn.title      = p.funcionou ? (p.dub?'Dublado PT-BR':'Legendado') : (p.motivo||'Indisponível');
                btn.tabIndex   = 0;
                btn.onclick    = () => { if (p.funcionou) carregarFonte(i); };
                wrap.appendChild(btn);
            });

            const idx = players.findIndex(p => p.funcionou);
            if (idx >= 0) carregarFonte(idx);
            else setLoading('Nenhuma fonte disponível para este filme.', '');

        } catch {
            setLoading('Erro ao buscar fontes.', 'Verifique o servidor.');
        }
    }

    function classeBtn(p, ativa) {
        if (!p.funcionou) return 'falhou';
        return p.dub ? (ativa ? 'dub-on' : 'dub-off') : (ativa ? 'leg-on' : 'leg-off');
    }

    function carregarFonte(idx) {
        const p = players[idx];
        if (!p || !p.funcionou) return;

        document.querySelectorAll('#fontes .btn-fonte').forEach((btn, i) => {
            btn.className = 'btn-fonte ' + classeBtn(players[i], i === idx);
        });

        setLoading(`Carregando via ${p.nome}...`,
            p.dub ? '🇧🇷 Dublagem PT-BR' : '📄 Legendado (fallback)');

        const frame = document.getElementById('frame');
        frame.onload  = () => document.getElementById('loading').classList.remove('vis');
        frame.onerror = () => setLoading(`⚠ Falha — tente outra fonte`, '');
        frame.src = p.url;
    }

    function setLoading(msg, sub) {
        document.getElementById('load-msg').textContent = msg;
        document.getElementById('load-sub').textContent = sub;
        document.getElementById('loading').classList.add('vis');
    }

    function fechar() {
        document.getElementById('player').classList.remove('ativo');
        document.getElementById('frame').src = '';
        document.getElementById('loading').classList.remove('vis');
        players = [];
    }

    document.addEventListener('keydown', e => { if (e.key === 'Escape') fechar(); });
    emAlta();
</script>
</body>
</html>
